[package]
name = "bizkit-marketplace-gossip"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
