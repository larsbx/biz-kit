name: Location cross-repository acceptance
on:
  pull_request:
  push:
    branches: [main]
  # The client moves independently: pick up d-patch main nightly, not only
  # when this repository changes.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      d_patch_ref:
        description: d-patch branch, tag or commit to test against
        default: main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  location-integration:
    name: location-integration (${{ matrix.client }}, trial ${{ matrix.trial }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        client: [browser, driver, courier]
        trial: [1, 2, 3]
        exclude:
          - {client: browser, trial: 2}
          - {client: browser, trial: 3}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ERL_FLAGS: '+S 4:4'
      PGPASSWORD: postgres
      BIZ_KIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # Nightly checks keep tracking d-patch main; PR/push checks pin the known
      # client for reproducibility. Manual runs may name another explicit ref.
      # "Start this server revision" prints both resolved commits.
      - uses: actions/checkout@v4
        with:
          repository: larsbx/d-patch
          ref: ${{ inputs.d_patch_ref || (github.event_name == 'schedule' && 'main') || '45198fe9c8fca664266c6e6891ddd7e80a48540d' }}
          path: d-patch
      - uses: erlef/setup-beam@v1
        with: { otp-version: '27.3.4', elixir-version: '1.19.0' }
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            apps/coop_substrate/priv/native
          key: location-dev-${{ runner.os }}-${{ hashFiles('mix.lock', 'apps/coop_substrate/native/**') }}
      - name: Start this server revision
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          git rev-parse HEAD
          git -C d-patch rev-parse HEAD
          if [ "$CLIENT" = browser ]; then
            export SPRUCE_GOOSE_PUBLIC_URL=http://127.0.0.1:4001
          else
            export SPRUCE_GOOSE_PUBLIC_URL=http://10.0.2.2:4001
          fi
          nohup scripts/e2e-stack.sh > "$RUNNER_TEMP/biz-kit-stack.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf -o /dev/null http://127.0.0.1:4000/health/live && curl -s -o /dev/null http://127.0.0.1:4001/auth/me; then
              exit 0
            fi
            sleep 5
          done
          tail -100 "$RUNNER_TEMP/biz-kit-stack.log"
          exit 1
      - uses: actions/setup-node@v4
        if: matrix.client == 'browser'
        with: { node-version: '22' }
      - name: Browser acceptance
        if: matrix.client == 'browser'
        working-directory: d-patch/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c biz-kit.config.js
      - uses: actions/setup-java@v4
        if: matrix.client != 'browser'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.client != 'browser'
      - name: Enable KVM
        if: matrix.client != 'browser'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.client != 'browser'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: d-patch/apps/android-driver
          script: ../../scripts/run-android-stack-acceptance.sh ${{ matrix.client }}
      - name: Sanitized client outcomes
        if: always() && matrix.client != 'browser'
        run: cat "$RUNNER_TEMP/acceptance-trace.log" 2>/dev/null || true
      # The artifact needs a download; why a run failed belongs in its log.
      - name: Show the failure
        if: failure()
        run: |
          find d-patch/apps/android-driver/app/build/outputs/androidTest-results -name 'TEST-*.xml' \
            -exec sed -n '/<failure/,/<\/failure>/p' {} + 2>/dev/null | head -200 || true
          echo "--- biz-kit stack log (tail) ---"
          tail -150 "$RUNNER_TEMP/biz-kit-stack.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: location-acceptance-${{ matrix.client }}-${{ matrix.trial }}
          path: |
            d-patch/e2e/playwright-report-biz-kit/
            d-patch/apps/android-driver/app/build/reports/androidTests/
            ${{ runner.temp }}/biz-kit-stack.log
            ${{ runner.temp }}/acceptance-trace.log
