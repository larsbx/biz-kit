name: Adder-ws CD contract
on:
  pull_request:
    paths: ['.github/workflows/deploy-adder-ws.yml', '.github/workflows/adder-ws-cd-acceptance.yml', 'tools/test_adder_ws_cd.py', 'docs/adder-ws-cd.md']
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-adder-ws.yml', '.github/workflows/adder-ws-cd-acceptance.yml', 'tools/test_adder_ws_cd.py', 'docs/adder-ws-cd.md']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 tools/test_adder_ws_cd.py
