name: CommerceCore extraction

on:
  pull_request:
    paths:
      - 'apps/commerce_core/**'
      - 'apps/restaurant_core/**'
      - 'apps/eatsbot_core/**'
      - 'apps/eatsbot/**'
      - 'apps/biz_kit_composition/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'config/**'
      - '.github/workflows/commerce-core.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commerce-pricing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Compile shared price kernel
        working-directory: apps/commerce_core
        run: MIX_ENV=test mix compile --warnings-as-errors
      - name: Validate formatting
        env:
          MIX_ENV: test
        run: >-
          mix format --check-formatted
          apps/commerce_core/mix.exs
          apps/commerce_core/lib/commerce_core/pricing.ex
          apps/commerce_core/test/pricing_test.exs
          apps/commerce_core/lib/commerce_core/tax.ex
          apps/commerce_core/test/tax_test.exs
          apps/commerce_core/test/eatsbot_characterization_test.exs
          apps/commerce_core/test/catalog_modifiers_test.exs
          apps/commerce_core/test/order_pipeline_test.exs
          apps/commerce_core/lib/commerce_core/order_lifecycle.ex
          apps/commerce_core/lib/commerce_core/checkout.ex
          apps/commerce_core/test/order_lifecycle_test.exs
          apps/commerce_core/test/checkout_safety_test.exs
          apps/commerce_core/lib/commerce_core/catalog.ex
          apps/commerce_core/lib/commerce_core/catalog_wire.ex
          apps/commerce_core/test/catalog_test.exs
          apps/commerce_core/test/catalog_wire_test.exs
          apps/eatsbot_core/lib/orders/pricing.ex
          apps/eatsbot_core/lib/products/catalog_bridge.ex
          apps/eatsbot/test/eatsbot/products/catalog_bridge_test.exs
      - name: Test CommerceCore independently of a database
        working-directory: apps/commerce_core
        run: mix test --no-start
