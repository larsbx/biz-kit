name: Ash authentication dependency resolution
on:
  pull_request:
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'security/ash-authentication-rc16'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Resolve rc.16 while retaining existing transitive locks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("apps").glob("*/mix.exs"):
              source = path.read_text()
              pinned = source.replace('{:ash_authentication, "~> 5.0-rc"}', '{:ash_authentication, "== 5.0.0-rc.16"}')
              if pinned != source:
                  path.write_text(pinned)
          lock = Path("mix.lock")
          lines = lock.read_text().splitlines(keepends=True)
          lock.write_text("".join(line for line in lines if not line.startswith('  "ash_authentication":')))
          PY
          if ! mix deps.get; then
            git restore mix.lock
            mix deps.update ash_authentication
          fi
          git restore -- 'apps/*/mix.exs'
          mix deps.get --check-locked
          git diff -- mix.lock
      - uses: actions/upload-artifact@v4
        with:
          name: ash-authentication-resolved-lock
          path: mix.lock
      - run: mix hex.audit
