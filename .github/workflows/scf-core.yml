name: SCF core (Algerian accounting)

on:
  pull_request:
    paths:
      - "apps/scf_core/**"
      - ".github/workflows/scf-core.yml"
  push:
    branches: [main]
    paths:
      - "apps/scf_core/**"
      - ".github/workflows/scf-core.yml"

permissions:
  contents: read

jobs:
  pure-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.19.0"
      - name: Pure SCF ledger, TVA and statement tests
        run: mix test
        working-directory: apps/scf_core
      - name: Check formatting
        run: |
          mix format mix.exs "lib/**/*.ex" "test/**/*.exs"
          git diff --exit-code -- mix.exs lib/ test/
        working-directory: apps/scf_core
