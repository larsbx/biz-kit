name: Formal obligation coverage

on:
  pull_request:
    paths:
      - "formal/**"
      - "proof_bank/**"
      - "apps/*/mix.exs"
      - "scripts/formal_coverage_audit.py"
      - "scripts/tests/test_formal_coverage_audit.py"
      - ".github/workflows/formal-coverage.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "proof_bank/**"
      - "apps/*/mix.exs"
      - "scripts/formal_coverage_audit.py"
      - "scripts/tests/test_formal_coverage_audit.py"
      - ".github/workflows/formal-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every catalog app is covered or listed uncovered; the uncovered list may
  # only shrink against the base branch.
  ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Audit tests
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_formal_coverage_audit.py' -v
      - name: Coverage and ratchet
        run: python3 -I scripts/formal_coverage_audit.py --base-ref "origin/${{ github.base_ref || 'main' }}"

  quint-obligations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install version-pinned Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.32.0
      - name: Simulate, verify, witness and control every covered Quint model
        run: bash formal/check_coverage.sh

  lean-obligations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore archive cache (always checksum verified before extraction)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/bizkit-lean-archives
          key: lean-archive-linux-x64-${{ hashFiles('formal/lean/install-toolchain.sh', 'formal/lean/lean-toolchain') }}
      - name: Install checksum-pinned Lean
        env:
          BIZKIT_LEAN_ARCHIVE_CACHE: ${{ runner.temp }}/bizkit-lean-archives
        run: |
          bash formal/lean/install-toolchain.sh "$RUNNER_TEMP/bizkit-lean"
          echo "$RUNNER_TEMP/bizkit-lean/bin" >> "$GITHUB_PATH"
      - name: Lean build, fresh kernel replay and all-module axiom audit
        run: bash formal/lean/check.sh
