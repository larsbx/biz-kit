name: Research exchange bounded MCP adapter
on:
  pull_request:
    paths:
      - 'apps/research_exchange/**'
      - 'docs/proof-bank/research-exchange/MCP_ADAPTER_REVIEW.md'
      - 'proof_bank/research_exchange/**'
      - '.github/workflows/research-exchange-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'apps/research_exchange/**'
      - 'docs/proof-bank/research-exchange/MCP_ADAPTER_REVIEW.md'
      - 'proof_bank/research_exchange/**'
      - '.github/workflows/research-exchange-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executable-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Formatting and warning-free compilation
        run: |
          elixir apps/research_exchange/test/format.exs --check
          mkdir -p "$RUNNER_TEMP/research-exchange-beams"
          elixirc --warnings-as-errors -o "$RUNNER_TEMP/research-exchange-beams" apps/research_exchange/lib/research_exchange/*.ex
      - name: Executable admission and stdio adversarial tests
        run: elixir apps/research_exchange/test/run.exs
      - name: Verify unchanged reviewed core source
        run: >-
          python3 proof_bank/research_exchange/tools/source_snapshot.py verify
          --expected-source-sha256 b22af2eb8fa3c7822faf6fac0d1cadd5cd0f65698865007671a5af48f9f50564
      # Kernel acceptance remains the separate complete core workflow. This job
      # does not run contributor artifacts, issue credits, or deploy anything.
