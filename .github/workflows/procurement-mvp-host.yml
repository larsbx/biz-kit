name: Procurement MVP host
on:
  pull_request:
    paths:
      - 'apps/procurement_host/**'
      - 'apps/coop_substrate/**'
      - 'apps/commerce_core/**'
      - 'apps/biz_kit_cluster/**'
      - 'apps/task_core/**'
      - 'apps/order_core/**'
      - 'apps/restaurant_core/**'
      - 'apps/fulfillment_core/**'
      - 'apps/agent_core/**'
      - 'apps/agent_ops_store/**'
      - 'apps/group_buy_core/**'
      - 'apps/inventory_core/**'
      - 'apps/federation_core/**'
      - 'apps/federation_service/**'
      - 'native/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'proofs/procurement_mvp/**'
      - 'tests/procurement_mvp/**'
      - 'desktop/**'
      - 'scripts/test-procurement-host.sh'
      - '.github/workflows/procurement-mvp-host.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procurement-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  runner-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Artifact gate negative controls and real TLS cookie transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/procurement-runner
          git rev-parse HEAD | tee .artifacts/procurement-runner/revision.txt
          python3 -m unittest discover -s tests/procurement_mvp -p test_release_acceptance.py -v 2>&1 | tee .artifacts/procurement-runner/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procurement-runner-${{ env.SOURCE_REVISION }}
          path: .artifacts/procurement-runner
          if-no-files-found: error
  ledger-http-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      EVENTSTORE_HOST: localhost
      PROCUREMENT_RELEASE_ACCEPTANCE: disposable-local-postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Match backup and restore clients to PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 openssl
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Actual ledger, TLS forms, packaged restart, revocation and restore
        run: bash scripts/test-procurement-host.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the Linux desktop package for host acceptance
        working-directory: desktop
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth
          cargo install tauri-driver --version 2.0.4 --locked
          npm ci
          npm run tauri build -- --ci --bundles deb
      - name: Packaged Tauri and packaged backend lifecycle on the same PostgreSQL fixture
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git diff --quiet HEAD -- desktop tests/procurement_mvp
          shopt -s nullglob
          packages=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          output=.artifacts/procurement-host
          mkdir -p "$output/tauri"
          desktop="$output/tauri/$(basename "${packages[0]}")"
          cp "${packages[0]}" "$desktop"
          tls=$(mktemp -d)
          trust="/usr/local/share/ca-certificates/biz-kit-procurement-e2e-$$.crt"
          trap 'sudo rm -f "$trust"; sudo update-ca-certificates >/dev/null; rm -rf "$tls"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=biz-kit-procurement-e2e \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$tls/key.pem" -out "$tls/cert.pem"
          sudo install -m 0644 "$tls/cert.pem" "$trust"
          sudo update-ca-certificates
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 tests/procurement_mvp/release_acceptance.py \
            --archive "$output/procurement-release.tar.gz" --revision "$SOURCE_REVISION" \
            --desktop-deb "$desktop" --tls-pair "$tls/cert.pem" "$tls/key.pem" \
            --receipts "$output/tauri" 2>&1 | tee "$output/tauri-acceptance.log"
          test -s "$output/tauri/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procurement-host-${{ env.SOURCE_REVISION }}
          path: .artifacts/procurement-host
          if-no-files-found: error
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay lifecycle and admission proofs/models independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/procurement-formal
          git rev-parse HEAD | tee .artifacts/procurement-formal/revision.txt
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          lean="$RUNNER_TEMP/lean-4.19.0-linux/bin/lean"
          "$lean" --version | tee .artifacts/procurement-formal/lean-version.txt
          for model in Workflow Admission; do
            "$lean" "proofs/procurement_mvp/$model.lean" 2>&1 | tee ".artifacts/procurement-formal/$model-axioms.log"
            if grep -q sorryAx ".artifacts/procurement-formal/$model-axioms.log"; then exit 1; fi
          done
          npm install --prefix "$RUNNER_TEMP/quint" --no-save @informalsystems/quint@0.33.1
          quint="$RUNNER_TEMP/quint/node_modules/.bin/quint"
          "$quint" --version | tee .artifacts/procurement-formal/quint-version.txt
          for model in workflow admission; do
            "$quint" typecheck "proofs/procurement_mvp/$model.qnt" 2>&1 | tee ".artifacts/procurement-formal/$model-typecheck.log"
            "$quint" test "proofs/procurement_mvp/$model.qnt" --seed=20261108 2>&1 | tee ".artifacts/procurement-formal/$model-tests.log"
            "$quint" run "proofs/procurement_mvp/$model.qnt" --invariant=invariant --max-steps=24 --max-samples=2000 --seed=20261108 2>&1 | tee ".artifacts/procurement-formal/$model-simulation.log"
          done
          sha256sum proofs/procurement_mvp/* > .artifacts/procurement-formal/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procurement-formal-${{ env.SOURCE_REVISION }}
          path: .artifacts/procurement-formal
          if-no-files-found: error
  host-acceptance:
    if: always()
    needs: [runner-controls, ledger-http-release, formal]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every scoped check; skipped is not accepted
        env:
          CONTROLS: ${{ needs.runner-controls.result }}
          RUNTIME: ${{ needs.ledger-http-release.result }}
          FORMAL: ${{ needs.formal.result }}
        run: |
          test "$CONTROLS" = success
          test "$RUNTIME" = success
          test "$FORMAL" = success
          echo "Scoped packaged backend and Linux Tauri acceptance at $SOURCE_REVISION; target-host deployment remains separate."
