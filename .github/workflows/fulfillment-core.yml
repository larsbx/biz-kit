name: FulfillmentCore contract

on:
  pull_request:
    paths:
      - 'apps/fulfillment_core/**'
      - 'apps/eatsbot_core/**'
      - 'apps/dispatch/**'
      - 'apps/biz_kit_composition/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'config/**'
      - '.github/workflows/fulfillment-core.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fulfillment-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix deps.get --check-locked
      - name: Compile fulfillment contract
        working-directory: apps/fulfillment_core
        run: MIX_ENV=test mix compile --warnings-as-errors
      - name: Verify format
        run: >-
          MIX_ENV=test mix format --check-formatted
          apps/fulfillment_core/mix.exs
          apps/fulfillment_core/lib/fulfillment_core.ex
          apps/fulfillment_core/lib/fulfillment_core/wire.ex
          apps/fulfillment_core/test/fulfillment_core_test.exs
          apps/fulfillment_core/test/wire_test.exs
          apps/eatsbot_core/lib/orders/fulfillment_bridge.ex
          apps/dispatch/lib/dispatch/fulfillment_bridge.ex
      - name: Validate shared contract
        working-directory: apps/fulfillment_core
        run: mix test --no-start
