name: Order core, restaurant layer and host

on:
  pull_request:
    paths:
      - 'apps/order_core/**'
      - 'apps/restaurant_core/**'
      - 'apps/commerce_core/**'
      - 'apps/coop_substrate/**'
      - 'apps/restaurant_host/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'config/**'
      - 'scripts/restaurant-release-smoke.sh'
      - 'scripts/restaurant_release_smoke.exs'
      - 'scripts/restaurant_enrollment_smoke_setup.exs'
      - 'config/runtime.exs'
      - '.github/workflows/restaurant-core.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pure-layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix deps.get --check-locked
      - name: Compile the money-free order core and kitchen layer
        run: |
          (cd apps/order_core && MIX_ENV=test mix compile --warnings-as-errors)
          (cd apps/restaurant_core && MIX_ENV=test mix compile --warnings-as-errors)
      - name: Verify format
        run: >-
          MIX_ENV=test mix format --check-formatted
          apps/order_core/mix.exs
          apps/order_core/lib/order_core/lifecycle.ex
          apps/order_core/lib/order_core/placement.ex
          apps/order_core/test/lifecycle_test.exs
          apps/restaurant_core/mix.exs
          apps/restaurant_core/lib/restaurant_core/kitchen.ex
          apps/restaurant_core/lib/restaurant_core/admission.ex
          apps/restaurant_core/test/kitchen_safety_test.exs
          apps/restaurant_core/test/admission_test.exs
          apps/coop_substrate/test/restaurant_admission_test.exs
      - name: Lifecycle properties, kitchen conformance and admission refinement
        run: |
          (cd apps/order_core && mix test --no-start)
          (cd apps/restaurant_core && mix test --no-start)

  substrate-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix deps.get --check-locked
      - name: Signed restaurant admission through the Log (race, authority, replay)
        working-directory: apps/coop_substrate
        run: mix test test/restaurant_admission_test.exs test/log_test.exs --warnings-as-errors

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix deps.get --check-locked
      - name: Compile the host
        working-directory: apps/restaurant_host
        run: mix compile --warnings-as-errors
      - name: Verify format
        run: mix format --check-formatted apps/restaurant_host/mix.exs "apps/restaurant_host/{config,lib,test}/**/*.{ex,exs}"
      # Slice 4's gate: a pickup order placed on the web, then accepted,
      # prepared and completed on the kitchen board, through the signed Log.
      - name: Storefront, board and orders against the Log
        working-directory: apps/restaurant_host
        run: mix test --no-start --warnings-as-errors

  release-smoke:
    # The production restaurant release: built, migrated twice, booted, its
    # storefront and board pairing checked over HTTP, and a pickup order placed
    # and completed on its own ledger (docs/deploy.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: MIX_ENV=prod mix deps.get --check-locked --only prod
      - name: Build, migrate, boot and exercise the release
        run: scripts/restaurant-release-smoke.sh
