name: Halaqa federation draft conformance

on:
  pull_request:
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft_rs/**'
      - 'tools/halaqa_receipt_draft/**'
      - 'tools/halaqa_receipt_draft.py'
      - 'tools/test_halaqa_receipt_draft.py'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft_rs/**'
      - 'tools/halaqa_receipt_draft/**'
      - 'tools/halaqa_receipt_draft.py'
      - 'tools/test_halaqa_receipt_draft.py'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'

permissions:
  contents: read

jobs:
  offline-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: openssl version
      - run: python3 tools/check_halaqa_federation_draft.py
      - run: python3 -m unittest discover -s tools -p 'test_halaqa_federation_draft.py' -v

  independent-elixir:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: elixir tools/check_halaqa_signed_draft.exs
      - run: elixir tools/test_halaqa_signed_draft.exs

  independent-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml
      - run: cargo run --locked --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml

  postgres-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test-cluster binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - name: Receipt concurrency, rollback and WAL recovery
        env:
          HALAQA_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -m unittest discover -s tools -p 'test_halaqa_receipt_draft.py' -v
