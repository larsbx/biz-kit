name: Halaqa federation draft conformance

on:
  pull_request:
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft_rs/**'
      - 'tools/check_halaqa_rust_differential.py'
      - 'tools/halaqa_receipt_draft/**'
      - 'tools/halaqa_receipt_draft.py'
      - 'tools/halaqa_outbox_draft.py'
      - 'tools/halaqa_iroh_draft.py'
      - 'tools/test_halaqa_iroh_draft.py'
      - 'tools/test_halaqa_iroh_relay.py'
      - 'tools/check_halaqa_two_hosts.py'
      - 'docs/architecture/2026-11-01-halaqa-two-host-acceptance.md'
      - 'tools/halaqa_iroh_draft_rs/**'
      - 'tools/test_halaqa_outbox_draft.py'
      - 'tools/test_halaqa_receipt_draft.py'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft_rs/**'
      - 'tools/check_halaqa_rust_differential.py'
      - 'tools/halaqa_receipt_draft/**'
      - 'tools/halaqa_receipt_draft.py'
      - 'tools/halaqa_outbox_draft.py'
      - 'tools/halaqa_iroh_draft.py'
      - 'tools/test_halaqa_iroh_draft.py'
      - 'tools/test_halaqa_iroh_relay.py'
      - 'tools/check_halaqa_two_hosts.py'
      - 'docs/architecture/2026-11-01-halaqa-two-host-acceptance.md'
      - 'tools/halaqa_iroh_draft_rs/**'
      - 'tools/test_halaqa_outbox_draft.py'
      - 'tools/test_halaqa_receipt_draft.py'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'

permissions:
  contents: read

jobs:
  offline-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: openssl version
      - run: python3 tools/check_halaqa_federation_draft.py
      - run: python3 -m unittest discover -s tools -p 'test_halaqa_federation_draft.py' -v

  independent-elixir:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: elixir tools/check_halaqa_signed_draft.exs
      - run: elixir tools/test_halaqa_signed_draft.exs

  independent-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check locked Rust conformance and retain exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/halaqa-rust-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/halaqa-rust-evidence/revision.txt"
          rustc -Vv | tee "$RUNNER_TEMP/halaqa-rust-evidence/rustc.txt"
          openssl version | tee "$RUNNER_TEMP/halaqa-rust-evidence/openssl.txt"
          cargo fetch --locked --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml
          cargo fmt --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml -- --check
          cargo clippy --locked --offline --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --offline --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/halaqa-rust-evidence/tests.txt"
          cargo run --locked --offline --manifest-path tools/halaqa_signed_draft_rs/Cargo.toml | tee "$RUNNER_TEMP/halaqa-rust-evidence/conformance.json"
          python3 tools/check_halaqa_rust_differential.py | tee "$RUNNER_TEMP/halaqa-rust-evidence/differential.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halaqa-offline-rust-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/halaqa-rust-evidence/
          if-no-files-found: error

  postgres-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test-cluster binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - name: Receiver receipts, rollback and WAL recovery
        env:
          HALAQA_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -m unittest discover -s tools -p 'test_halaqa_receipt_draft.py' -v
      - name: Sender custody and two-database reconciliation
        env:
          HALAQA_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -m unittest discover -s tools -p 'test_halaqa_outbox_draft.py' -v

  iroh-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install isolated test-cluster binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - run: cargo fmt --manifest-path tools/halaqa_iroh_draft_rs/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path tools/halaqa_iroh_draft_rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/halaqa_iroh_draft_rs/Cargo.toml
      - run: cargo build --locked --manifest-path tools/halaqa_iroh_draft_rs/Cargo.toml
      - name: Pinned direct Iroh, receiver restart and lost-reply reconciliation
        env:
          HALAQA_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -m unittest discover -s tools -p 'test_halaqa_iroh_draft.py' -v
      - name: Verified relay paths, TLS refusal and operator-role rehearsal
        env:
          HALAQA_PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -m unittest discover -s tools -p 'test_halaqa_iroh_relay.py' -v
