name: Halaqa federation draft conformance

on:
  pull_request:
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_rust_differential.py'
      - 'tools/halaqa_signed_rust/**'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'
  push:
    branches: [main]
    paths:
      - 'tools/check_halaqa_federation_draft.py'
      - 'tools/test_halaqa_federation_draft.py'
      - 'tools/halaqa_federation_draft/**'
      - 'tools/halaqa_signed_draft.exs'
      - 'tools/check_halaqa_rust_differential.py'
      - 'tools/halaqa_signed_rust/**'
      - 'tools/check_halaqa_signed_draft.exs'
      - 'tools/test_halaqa_signed_draft.exs'
      - 'docs/architecture/2026-10-31-halaqa-iroh-federation-boundary.md'
      - '.github/workflows/halaqa-federation-draft.yml'

permissions:
  contents: read

jobs:
  offline-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: openssl version
      - run: python3 tools/check_halaqa_federation_draft.py
      - run: python3 -m unittest discover -s tools -p 'test_halaqa_federation_draft.py' -v

  independent-elixir:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: elixir tools/check_halaqa_signed_draft.exs
      - run: elixir tools/test_halaqa_signed_draft.exs

  independent-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Check locked Rust conformance and preserve output
        shell: bash
        run: |
          set -euo pipefail
          rustup override set 1.93.1
          mkdir -p "$RUNNER_TEMP/halaqa-rust-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/halaqa-rust-evidence/revision.txt"
          rustc -Vv | tee "$RUNNER_TEMP/halaqa-rust-evidence/rustc.txt"
          openssl version | tee "$RUNNER_TEMP/halaqa-rust-evidence/openssl.txt"
          cargo fetch --locked --manifest-path tools/halaqa_signed_rust/Cargo.toml
          cargo fmt --manifest-path tools/halaqa_signed_rust/Cargo.toml -- --check
          cargo clippy --locked --offline --manifest-path tools/halaqa_signed_rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --offline --manifest-path tools/halaqa_signed_rust/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/halaqa-rust-evidence/tests.txt"
          cargo run --locked --offline --manifest-path tools/halaqa_signed_rust/Cargo.toml | tee "$RUNNER_TEMP/halaqa-rust-evidence/conformance.json"
          python3 tools/check_halaqa_rust_differential.py | tee "$RUNNER_TEMP/halaqa-rust-evidence/differential.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halaqa-offline-rust-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/halaqa-rust-evidence/
          if-no-files-found: error
