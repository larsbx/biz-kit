name: CI workflow inventory (advisory)

# Read-only coverage audit, NOT a required status check or test replacement.
# Existing application workflows remain unchanged.
on:
  pull_request:
    paths:
      - 'tools/ci_workflow_inventory.py'
      - 'tools/test_ci_workflow_inventory.py'
      - '.github/workflows/**'
      - 'docs/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test inventory parser and refusal cases
        run: python -m unittest tools/test_ci_workflow_inventory.py -v
      - name: Record full local workflow-trigger inventory
        run: python tools/ci_workflow_inventory.py --root . --require-complete --output ci-workflow-inventory.json
      - name: Archive exact-run advisory observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biz-kit-ci-workflow-inventory
          path: ci-workflow-inventory.json
          if-no-files-found: warn
          retention-days: 30
