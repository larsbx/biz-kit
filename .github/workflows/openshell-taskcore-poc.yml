name: OpenShell TaskCore POC (offline contract)

on:
  pull_request:
    paths:
      - "experiments/openshell_taskcore/**"
      - ".github/workflows/openshell-taskcore-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Offline sandbox lifecycle contracts
        run: python -m unittest discover -s experiments/openshell_taskcore -p 'test_*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q experiments/openshell_taskcore
