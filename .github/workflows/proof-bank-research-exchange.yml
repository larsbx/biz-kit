name: Proof Bank — Research exchange verification core

on:
  pull_request:
    paths:
      - 'proof_bank/research_exchange/**'
      - 'docs/proof-bank/research-exchange/**'
      - '.github/workflows/proof-bank-research-exchange.yml'
  push:
    branches: [main]
    paths:
      - 'proof_bank/research_exchange/**'
      - 'docs/proof-bank/research-exchange/**'
      - '.github/workflows/proof-bank-research-exchange.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-exchange-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: Research exchange complete verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FRE_SOURCE_SHA256: 'c6e74348b4664e1a4f3c260557a8a1bc8707c40ed758c553ad8a8195be445924'
    defaults:
      run:
        working-directory: proof_bank/research_exchange
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Bind reviewed package to the exact Git revision
        env:
          FRE_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          FRE_WORKFLOW_REF: ${{ github.workflow_ref }}
          FRE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FRE_EXPECTED_REVISION"
          python3 tools/source_snapshot.py verify --expected-source-sha256 "$FRE_SOURCE_SHA256"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          output = Path('evidence')
          output.mkdir(exist_ok=True)
          record = {
              'schema': 'biz-kit/research-exchange-git-provenance/v1',
              'git_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'git_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'expected_commit': os.environ['FRE_EXPECTED_REVISION'],
              'workflow_ref': os.environ['FRE_WORKFLOW_REF'],
              'workflow_sha': os.environ['FRE_WORKFLOW_SHA'],
              'source_sha256': hashlib.sha256(Path('SOURCE_MANIFEST.json').read_bytes()).hexdigest(),
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          (output / 'git-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/research-exchange-tools/*.tar.zst
            ${{ runner.temp }}/research-exchange-tools/*.tar.gz
            ${{ runner.temp }}/research-exchange-tools/*.tgz
          key: research-exchange-archives-linux-x64-${{ hashFiles('proof_bank/research_exchange/toolchains.lock.json') }}
      - name: Install the pinned proof toolchains
        run: |
          set -euo pipefail
          command -v zstd
          test "$(node --version)" = 'v24.22.1'
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
          test "$(npm --version)" = '11.9.0'
          python3 tools/bootstrap.py --destination "$RUNNER_TEMP/research-exchange-tools"
      - name: Run all 12 required proof, model and adapter acceptance stages
        run: |
          set -euo pipefail
          FRE_TOOLS="$RUNNER_TEMP/research-exchange-tools"
          python3 tools/verify.py \
            --expected-source-sha256 "$FRE_SOURCE_SHA256" \
            --lean-root "$FRE_TOOLS/lean-4.35.0-linux" \
            --quint-cli "$FRE_TOOLS/quint/node_modules/@informalsystems/quint/dist/src/cli.js" \
            --java-bin "$FRE_TOOLS/jdk-21.0.13+9-jre/bin/java" \
            --quint-home "$FRE_TOOLS/quint-home" \
            --output evidence/ci
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('evidence/ci/receipt.json').read_text())
          stages = receipt['stages']
          if not (receipt['status'] == 'passed'
                  and receipt['required_stage_count'] == 12
                  and len(stages) == 12
                  and [stage['id'] for stage in stages] == receipt['required_stage_ids']
                  and {'adapter_model_checks', 'adapter_acceptance'} <= {stage['id'] for stage in stages}
                  and all(stage['status'] == 'passed' for stage in stages)
                  and receipt['stages_not_run'] == []):
              raise SystemExit('The complete successful 12-stage receipt is required')
          print('ALL_12_REQUIRED_STAGES_PASSED')
          PY
      - name: Preserve proof evidence and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-exchange-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: proof_bank/research_exchange/evidence/
          if-no-files-found: error
          retention-days: 30
