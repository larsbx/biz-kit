name: Formal safety proofs (Lean + Quint)

on:
  pull_request:
    paths:
      - "formal/**"
      - "apps/dispatch/lib/dispatch/operations/**"
      - "apps/dispatch/lib/dispatch/fleet/assignment.ex"
      - "apps/dispatch/lib/dispatch/idempotency.ex"
      - "apps/dispatch/lib/dispatch_web/controllers/operations_controller.ex"
      - "desktop/src/lib/panels.ts"
      - "desktop/src/lib/PanelContent.svelte"
      - "apps/agent_ops_store/**"
      - "apps/coop_substrate/lib/coop_substrate/signed_consumer_source.ex"
      - "apps/coop_substrate/test/signed_consumer_source_test.exs"
      - "apps/coop_substrate/test/signed_event_replay_test.exs"
      - ".github/workflows/signed-event-replay-acceptance.yml"
      - "apps/coop_substrate/lib/coop_substrate/log.ex"
      - "apps/coop_substrate/lib/coop_substrate/protocol/**"
      - "deploy/agent-core/**"
      - ".github/workflows/agent-core-storage.yml"
      - ".github/workflows/consolidation.yml"
      - ".github/workflows/event-consumer-proofs.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "apps/dispatch/lib/dispatch/operations/**"
      - "apps/dispatch/lib/dispatch/fleet/assignment.ex"
      - "apps/dispatch/lib/dispatch/idempotency.ex"
      - "apps/dispatch/lib/dispatch_web/controllers/operations_controller.ex"
      - "desktop/src/lib/panels.ts"
      - "desktop/src/lib/PanelContent.svelte"
      - "apps/agent_ops_store/**"
      - "apps/coop_substrate/lib/coop_substrate/signed_consumer_source.ex"
      - "apps/coop_substrate/test/signed_consumer_source_test.exs"
      - "apps/coop_substrate/test/signed_event_replay_test.exs"
      - ".github/workflows/signed-event-replay-acceptance.yml"
      - "apps/coop_substrate/lib/coop_substrate/log.ex"
      - "apps/coop_substrate/lib/coop_substrate/protocol/**"
      - "deploy/agent-core/**"
      - ".github/workflows/agent-core-storage.yml"
      - ".github/workflows/consolidation.yml"
      - ".github/workflows/event-consumer-proofs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-kernel-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore archive cache (always checksum verified before extraction)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/bizkit-lean-archives
          key: lean-archive-linux-x64-${{ hashFiles('formal/lean/install-toolchain.sh', 'formal/lean/lean-toolchain') }}
      - name: Install checksum-pinned Lean without release redirect
        env:
          BIZKIT_LEAN_ARCHIVE_CACHE: ${{ runner.temp }}/bizkit-lean-archives
        run: |
          bash formal/lean/install-toolchain.sh "$RUNNER_TEMP/bizkit-lean"
          echo "$RUNNER_TEMP/bizkit-lean/bin" >> "$GITHUB_PATH"
      - name: Record exact source revision
        run: git rev-parse HEAD
      - name: Lean build, fresh kernel replay and all-module axiom audit
        run: bash formal/lean/check.sh

  quint-bounded-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install version-pinned Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.32.0
      - name: Record exact source revision
        run: git rev-parse HEAD
      - name: Typecheck, simulate, model check and refute cursor-first bug
        run: bash formal/quint/check.sh
