name: Federation discovery
on:
  pull_request:
    paths:
      - 'mix.lock'
      - 'apps/federation_core/**'
      - 'apps/federation_service/**'
      - 'apps/coop_substrate/**'
      - 'native/marketplace_gossip/**'
      - 'scripts/test-federation-service.sh'
      - 'scripts/test-federation-authority.sh'
      - '.github/workflows/federation-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'mix.lock'
      - 'apps/federation_core/**'
      - 'apps/federation_service/**'
      - 'apps/coop_substrate/**'
      - 'native/marketplace_gossip/**'
      - 'scripts/test-federation-service.sh'
      - 'scripts/test-federation-authority.sh'
      - '.github/workflows/federation-discovery.yml'
permissions:
  contents: read
jobs:
  native-subscription-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix local.hex --force && mix local.rebar --force
      - uses: dtolnay/rust-toolchain@stable
      - name: Signed ledger authority, database fence and TLS acceptance
        run: scripts/test-federation-authority.sh

  two-node-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix local.hex --force && mix local.rebar --force
      - name: Independent wire vectors and negative controls (Python 3.12 / OpenSSL)
        run: python3 -m unittest discover -s apps/federation_service/test/support -p 'gossip_reference_test.py' -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path native/marketplace_gossip/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path native/marketplace_gossip/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/marketplace_gossip/Cargo.toml
      - run: cargo build --locked --manifest-path native/marketplace_gossip/Cargo.toml
      - run: scripts/test-federation-service.sh
        env:
          BIZKIT_GOSSIP_EXECUTABLE: ${{ github.workspace }}/native/marketplace_gossip/target/debug/bizkit-marketplace-gossip

  full-lock-audit:
    # Audit every shared-lock entry, including optional and unused packages.
    # No ignored advisories or informational failure allowance.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix local.hex --force
      - name: Audit full shared lock
        id: audit
        run: |
          mkdir -p /tmp/bizkit-full-lock-audit
          cp mix.lock /tmp/bizkit-full-lock-audit/
          cd /tmp/bizkit-full-lock-audit
          printf '%s\n' 'defmodule Audit.MixProject do' ' use Mix.Project' ' def project, do: [app: :audit, version: "0.0.0", deps: []]' 'end' > mix.exs
          mix hex.audit --format sarif --output "$GITHUB_WORKSPACE/full-lock-audit.sarif"
      - name: Record audit outcome
        if: always()
        run: echo 'Full-lock audit outcome = ${{ steps.audit.outcome }}; see SARIF and docs/security/remaining-dependencies-2026-10.md' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-lock-audit
          path: full-lock-audit.sarif
          if-no-files-found: error
