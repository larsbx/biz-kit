name: BizOps knowledge catalog acceptance

on:
  pull_request:
    paths:
      - 'apps/bizops_kb/**'
      - 'scripts/bizops-kb/**'
      - 'apps/task_host/priv/static/app/knowledge*'
      - 'apps/task_host/test/js/knowledge.test.mjs'
      - '.github/workflows/bizops-kb-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/bizops_kb/**'
      - 'scripts/bizops-kb/**'
      - 'apps/task_host/priv/static/app/knowledge*'
      - 'apps/task_host/test/js/knowledge.test.mjs'
      - '.github/workflows/bizops-kb-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: bizops-kb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-and-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record evaluated source revision
        run: git rev-parse HEAD
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned source commit, trees, documents and links offline
        run: python3 scripts/bizops-kb/snapshot.py check
      - name: Source integrity and reproducible import negative controls
        run: python3 -m unittest discover -s scripts/bizops-kb -p 'test_*.py' -v
      - name: Standalone catalog and malformed-input acceptance
        run: >-
          elixir -r apps/bizops_kb/lib/bizops_kb/catalog.ex
          -r apps/bizops_kb/test/test_helper.exs
          apps/bizops_kb/test/catalog_test.exs
      - name: Check standalone app formatting
        working-directory: apps/bizops_kb
        run: mix format --check-formatted
      - name: Safe document rendering and browser-state contract
        run: node --test apps/task_host/test/js/knowledge.test.mjs
