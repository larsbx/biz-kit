name: Consolidation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger-and-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      SPRUCE_GOOSE_TEST_DATABASE_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Compile the umbrella
        run: mix compile --warnings-as-errors
      - name: Verify changed Elixir formatting
        run: >-
          mix format --check-formatted
          apps/coop_substrate/lib/coop_substrate/artifact_custody.ex
          apps/coop_substrate/lib/coop_substrate/harness/artifacts.ex
          apps/coop_substrate/lib/coop_substrate/tasks/readiness.ex
          apps/coop_substrate/test/task_readiness_commands_test.exs
          apps/coop_substrate/lib/coop_substrate/tasks.ex
          apps/coop_substrate/lib/coop_substrate/buzz/tasks.ex
          apps/coop_substrate/lib/coop_substrate/tasks/dod.ex
          apps/coop_substrate/test/no_surveillance_test.exs
          apps/coop_substrate/test/artifact_custody_store_test.exs
          apps/coop_substrate/test/task_dod_rules_test.exs
          apps/coop_substrate/test/task_dod_commands_test.exs
          apps/coop_substrate/test/buzz_task_cards_test.exs
          apps/coop_substrate/lib/coop_substrate/projections/tasks.ex
          apps/coop_substrate/lib/coop_substrate/log.ex
          apps/coop_substrate/lib/coop_substrate/projections/membership.ex
          apps/coop_substrate/lib/coop_substrate/protocol/type_registry.ex
          apps/coop_substrate/lib/coop_substrate/protocol/validity.ex
          apps/coop_substrate/test/task_commands_test.exs
          apps/coop_substrate/test/support/log_case.ex
          apps/coop_substrate/lib/coop_substrate/feed.ex
          apps/coop_substrate/lib/coop_substrate/feed/view.ex
          apps/coop_substrate/lib/coop_substrate/feed/sse.ex
          apps/coop_substrate/lib/coop_substrate/application.ex
          apps/coop_substrate/test/change_feed_test.exs
          apps/coop_substrate/test/change_feed_view_test.exs
          apps/coop_substrate/test/support/task_histories.ex
          apps/coop_substrate/test/task_suggestions_properties_test.exs
          apps/coop_substrate/lib/coop_substrate/feed/access.ex
          apps/coop_substrate/lib/coop_substrate/feed/nonces.ex
          apps/coop_substrate/test/feed_access_test.exs
          apps/spruce_goose/lib/spruce_goose/web/feed_controller.ex
          apps/spruce_goose/lib/spruce_goose/web/router.ex
          apps/spruce_goose/test/spruce_goose/web/feed_test.exs
          apps/spruce_goose/config/test.exs
          apps/spruce_goose/lib/spruce_goose/web/auth_controller.ex
          apps/spruce_goose/test/spruce_goose/web/auth_test.exs
          apps/spruce_goose/test/support/ledger_fixtures.ex
          apps/biz_kit_identity/mix.exs
          apps/biz_kit_identity/lib/biz_kit/identity.ex
          apps/biz_kit_identity/lib/biz_kit/identity/application.ex
          apps/biz_kit_identity/lib/biz_kit/identity/principal.ex
          apps/biz_kit_identity/lib/biz_kit/identity/provider.ex
          apps/biz_kit_identity/lib/biz_kit/identity/resolver.ex
          apps/biz_kit_identity/lib/biz_kit/identity/sessions.ex
          apps/biz_kit_identity/lib/biz_kit/identity/providers/work_os.ex
          apps/biz_kit_identity/test/identity_test.exs
          apps/coop_substrate/lib/coop_substrate/commands.ex
          apps/coop_substrate/lib/coop_substrate/tasks/decisions.ex
          apps/coop_substrate/test/commands_test.exs
          apps/spruce_goose/lib/spruce_goose/web/command_controller.ex
          apps/spruce_goose/lib/spruce_goose/web/app_controller.ex
          apps/spruce_goose/test/spruce_goose/web/command_test.exs
          apps/spruce_goose/test/spruce_goose/web/browser_test.exs
          apps/spruce_goose/test/support/identity_fixtures.ex
          apps/coop_substrate/lib/coop_substrate/enrolments.ex
          apps/coop_substrate/lib/coop_substrate/enrolments/approver.ex
          apps/coop_substrate/lib/mix/tasks/coop.enrol.ex
          apps/coop_substrate/test/enrolments_test.exs
          apps/spruce_goose/lib/spruce_goose/web/requests.ex
          apps/spruce_goose/lib/spruce_goose/web/device_controller.ex
          apps/spruce_goose/lib/spruce_goose/web/enrolment_controller.ex
          apps/spruce_goose/test/spruce_goose/web/device_test.exs
          apps/coop_substrate/lib/coop_substrate/devices.ex
          apps/coop_substrate/lib/coop_substrate/devices/revoker.ex
          apps/coop_substrate/lib/coop_substrate/governance/client.ex
          apps/coop_substrate/lib/mix/tasks/coop.revoke.ex
          apps/coop_substrate/test/device_revocation_test.exs
          apps/coop_substrate/lib/coop_substrate/tasks.ex
          apps/coop_substrate/lib/coop_substrate/projections/tasks.ex
          apps/coop_substrate/test/support/task_histories.ex
          apps/coop_substrate/test/support/task_timing_fixtures.ex
          apps/spruce_goose/lib/spruce_goose/web/grant_controller.ex
          apps/spruce_goose/test/spruce_goose/web/revocation_test.exs
          apps/spruce_goose/test/support/ledger_fixtures.ex
          apps/spruce_goose/mix.exs
          apps/spruce_goose/config/config.exs
          apps/coop_substrate/lib/coop_substrate/offboarding.ex
          apps/coop_substrate/lib/coop_substrate/offboarding/offboarder.ex
          apps/coop_substrate/lib/coop_substrate/governance/read.ex
          apps/coop_substrate/lib/coop_substrate/enrolments.ex
          apps/coop_substrate/lib/mix/tasks/coop.offboard.ex
          apps/coop_substrate/test/offboarding_test.exs
          apps/coop_substrate/test/task_suggestions_properties_test.exs
          apps/spruce_goose/lib/spruce_goose/web/principal_controller.ex
          apps/spruce_goose/lib/spruce_goose/web/requests.ex
          apps/spruce_goose/lib/spruce_goose/web/router.ex
          apps/spruce_goose/test/spruce_goose/web/offboarding_test.exs
          apps/spruce_goose/lib/spruce_goose/web/rate_limit.ex
          apps/spruce_goose/lib/spruce_goose/web/rate_limit/counts.ex
          apps/spruce_goose/test/spruce_goose/web/rate_limit_test.exs
          apps/spruce_goose/lib/spruce_goose/application.ex
          apps/spruce_goose/lib/spruce_goose/web/endpoint.ex
          apps/biz_kit_cluster/mix.exs
          apps/biz_kit_cluster/lib/biz_kit/cluster.ex
          apps/biz_kit_cluster/lib/biz_kit/cluster/application.ex
          apps/biz_kit_cluster/lib/biz_kit/cluster/singleton.ex
          apps/biz_kit_cluster/test/support/peers.ex
          apps/biz_kit_cluster/test/singleton_test.exs
          apps/coop_substrate/test/cluster_test.exs
          apps/biz_kit_identity/test/cluster_sessions_test.exs
          apps/coop_substrate/lib/coop_substrate/tasks/lifecycle.ex
          apps/coop_substrate/test/lifecycle_test.exs
          apps/spruce_goose/test/spruce_goose/web/lifecycle_test.exs
      - name: Test the common ledger
        working-directory: apps/coop_substrate
        run: mix test
      - name: Test the cluster primitives
        working-directory: apps/biz_kit_cluster
        run: mix test
      - name: Test identity
        working-directory: apps/biz_kit_identity
        run: mix test
      - name: Create and migrate orchestration database
        working-directory: apps/spruce_goose
        run: mix ecto.create && mix ecto.migrate
      # SpruceGoose starts the ledger too (it serves the change feed), against
      # the event store the ledger step above created.
      - name: Test orchestration after notes retirement
        working-directory: apps/spruce_goose
        run: mix test
      # The web view: its modules against the ledger's canonical vectors, then
      # the first workflow in Chromium (sign in, enrol the device key, accept
      # an agent's suggestion, signed in the browser).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the web view's modules
        run: node --test apps/spruce_goose/test/js/*.test.mjs
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test the workflow in a browser
        working-directory: apps/spruce_goose
        run: mix test --only browser

  ledger-model:
    # Model-checks every spec in apps/coop_substrate/spec (task suggestions
    # and delegation, readiness, the change feed): safety holds sampled and
    # exhaustively to depth 5, and every witness state is reachable. About
    # 7 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apalache, which `quint verify` downloads, needs Java 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Quint
        run: npm install -g @informalsystems/quint@0.25.1
      - name: Model-check the ledger specs
        run: apps/coop_substrate/spec/check.sh
