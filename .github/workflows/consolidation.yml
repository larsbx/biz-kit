      # Dispatch's unit tier: no PostGIS here, so the integration tier stays
      # local (`mix test --include integration`). The contract check keeps
      # apps/dispatch/contracts/openapi.json, which the field app is held to,
      # in step with the router.
      - name: Test dispatch (unit tier) and its contract
        working-directory: apps/dispatch
        run: mix test && mix openapi.check
      - name: Test the task core
        working-directory: apps/task_core
        run: mix test
      - name: Test the common ledger
        working-directory: apps/coop_substrate
        run: mix test
      - name: Test the cluster primitives
        working-directory: apps/biz_kit_cluster
        run: mix test
      - name: Test identity
        working-directory: apps/biz_kit_identity
        run: mix test
      - name: Create and migrate orchestration database
        working-directory: apps/spruce_goose
        run: mix ecto.create && mix ecto.migrate
      # SpruceGoose starts the ledger too (it serves the change feed), against
      # the event store the ledger step above created.
      - name: Test orchestration after notes retirement
        working-directory: apps/spruce_goose
        run: mix test
      - name: Test registry revocation across separate database sessions
        working-directory: apps/spruce_goose
        run: SPRUCE_GOOSE_TEST_DOGFOOD=true mix test test/actors_separate_sessions_test.exs --include separate_sessions
      # The web view: its modules against the ledger's canonical vectors, then
      # the first workflow in Chromium (sign in, enrol the device key, accept
      # an agent's suggestion, signed in the browser).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the web view's modules
        run: node --test apps/spruce_goose/test/js/*.test.mjs
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test the workflow in a browser
        working-directory: apps/spruce_goose
        run: mix test --only browser

  release-smoke:
    # The production orchestration release (the ledger and SpruceGoose,
    # without dispatch): built, migrated twice, booted, its web view served,
    # and task commands admitted and refused on its own ledger
    # (scripts/release-smoke.sh, docs/deploy.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: MIX_ENV=prod mix deps.get --check-locked --only prod
      - name: Build, migrate, boot and exercise the release
        run: scripts/release-smoke.sh

  ledger-model:
    # Model-checks every spec in apps/task_core/spec (task suggestions and
    # delegation, readiness, cancellation and blueprint runs) and the ledger
    # change feed in apps/coop_substrate/spec: sampled safety, exhaustive depth 5, and
    # every witness state is reachable. About 7 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apalache, which `quint verify` downloads, needs Java 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Quint
        run: npm install -g @informalsystems/quint@0.25.1
      - name: Model-check the task core specs
        run: apps/task_core/spec/check.sh
      - name: Model-check the ledger specs
        run: apps/coop_substrate/spec/check.sh
