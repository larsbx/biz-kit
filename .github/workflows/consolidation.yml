name: Consolidation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger-and-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      SPRUCE_GOOSE_TEST_DATABASE_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Compile the umbrella
        run: mix compile --warnings-as-errors
      - name: Verify changed Elixir formatting
        run: >-
          mix format --check-formatted
          apps/coop_substrate/lib/coop_substrate/artifact_custody.ex
          apps/coop_substrate/lib/coop_substrate/harness/artifacts.ex
          apps/task_core/lib/task_core/readiness.ex
          apps/task_core/lib/task_core/todos.ex
          apps/task_core/lib/task_core/steps.ex
          apps/task_core/test/salvage_test.exs
