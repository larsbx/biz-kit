name: Portable business cores — Eatsbot OTP 26 compatibility

on:
  pull_request:
    paths:
      - 'apps/task_core/**'
      - 'apps/order_core/**'
      - 'apps/commerce_core/**'
      - 'tools/merchant_pilot/**'
      - 'apps/restaurant_core/**'
      - 'apps/inventory_core/**'
      - 'apps/fulfillment_core/**'
      - 'apps/sales_core/**'
      - '.github/workflows/portable-eatsbot-compat.yml'
      - 'mix.lock'
      - 'mix.exs'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  external-eatsbot-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        app: [task_core, order_core, commerce_core, inventory_core, fulfillment_core, sales_core]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2.5.21'
          elixir-version: '1.18.4'
      - name: Copy source out of umbrella and validate standalone version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/portable-eatsbot"
          cp -R "apps/${{ matrix.app }}" "$RUNNER_TEMP/portable-eatsbot/"
          # In-umbrella sibling dependencies resolve as ../<app> outside it too.
          for sibling in order_core restaurant_core fulfillment_core; do
            [ -d "$RUNNER_TEMP/portable-eatsbot/$sibling" ] || cp -R "apps/$sibling" "$RUNNER_TEMP/portable-eatsbot/"
          done
          # CommerceCore's merchant pilot tests read the pilot tool's shared
          # fixtures at ../../../tools/merchant_pilot from its test directory,
          # which is $RUNNER_TEMP/tools/merchant_pilot once the package is copied.
          if [ "${{ matrix.app }}" = commerce_core ]; then
            mkdir -p "$RUNNER_TEMP/tools"
            cp -R tools/merchant_pilot "$RUNNER_TEMP/tools/"
          fi
          cd "$RUNNER_TEMP/portable-eatsbot/${{ matrix.app }}"
          mix --version
          mix deps.get
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test --no-start
