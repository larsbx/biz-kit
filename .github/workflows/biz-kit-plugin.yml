name: Biz-Kit plugin

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/biz-kit/**"
      - "tools/validate_biz_kit_plugin.py"
      - ".github/workflows/biz-kit-plugin.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/biz-kit/**"
      - "tools/validate_biz_kit_plugin.py"
      - ".github/workflows/biz-kit-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable plugin and repository marketplace
        run: python tools/validate_biz_kit_plugin.py
