name: Economic simulation laboratory
on:
  pull_request:
    paths:
      - 'experiments/economic_simulation/**'
      - 'tools/merchant_pilot/**'
      - 'apps/commerce_core/lib/commerce_core/merchant_pilot*'
      - 'apps/commerce_core/lib/commerce_core/merchant_pilot/**'
      - '.github/workflows/economic-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/economic_simulation/**'
      - 'tools/merchant_pilot/**'
      - 'apps/commerce_core/lib/commerce_core/merchant_pilot*'
      - 'apps/commerce_core/lib/commerce_core/merchant_pilot/**'
      - '.github/workflows/economic-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdlib-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Exact matching and physical transition controls without optional runtimes
        run: |
          python -m unittest discover -s experiments/economic_simulation/tests -p test_matching.py -v
          python -m unittest discover -s experiments/economic_simulation/tests -p test_engine_adversarial.py -v
          python -m unittest discover -s experiments/economic_simulation/tests -p test_pilot.py -v
          python -m experiments.economic_simulation.schemas.generate --check
  research-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.6
      - name: Install the frozen research and schema-validation environment
        run: uv sync --project experiments/economic_simulation --frozen --extra research
      - name: Real framework adapters, public contracts and all regression controls
        run: |
          uv run --project experiments/economic_simulation --frozen --extra research python - <<'PY'
          import importlib.metadata
          import unittest
          for package, expected in (("Mesa", "3.5.2"), ("negmas", "0.17.0"), ("jsonschema", "4.23.0")):
              assert importlib.metadata.version(package) == expected
          suite = unittest.defaultTestLoader.discover("experiments/economic_simulation/tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Reproducible example runs and paired policy comparison
        run: |
          mkdir -p experiments/economic_simulation/out
          python -m experiments.economic_simulation run experiments/economic_simulation/examples/demand_first.json --seed 0 --output experiments/economic_simulation/out/demand.json
          python -m experiments.economic_simulation run experiments/economic_simulation/examples/barter_fragility.json --seed 0 --output experiments/economic_simulation/out/barter.json
          python -m experiments.economic_simulation sweep experiments/economic_simulation/examples/demand_first.json --replicates 20 --policies experiments/economic_simulation/examples/policies.json --output experiments/economic_simulation/out/comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: economic-simulation-${{ github.event.pull_request.head.sha || github.sha }}
          path: experiments/economic_simulation/out/*.json
          if-no-files-found: error
  canonical-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Actual simulation exports through the unchanged Elixir scorecard
        run: python experiments/economic_simulation/tests/pilot_interop.py --require-elixir

