name: Proof Bank — Dispatch model-to-runtime pilot

on:
  pull_request:
    paths:
      - 'apps/proof_bank_core/**'
      - 'formal/lean/**'
      - 'formal/quint/**'
      - 'apps/dispatch/lib/dispatch/operations/**'
      - 'apps/dispatch/test/dispatch/operations/board_test.exs'
      - 'apps/dispatch/test/dispatch/operations/board_concurrency_test.exs'
      - 'docs/architecture/2026-11-01-proof-bank-dispatch-pilot.md'
      - '.github/workflows/proof-bank-dispatch-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'apps/proof_bank_core/**'
      - 'formal/lean/**'
      - 'formal/quint/**'
      - 'apps/dispatch/lib/dispatch/operations/**'
      - 'apps/dispatch/test/dispatch/operations/board_test.exs'
      - 'apps/dispatch/test/dispatch/operations/board_concurrency_test.exs'
      - '.github/workflows/proof-bank-dispatch-pilot.yml'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact revision
        run: git rev-parse HEAD
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/bizkit-lean-archives
          key: lean-archive-linux-x64-${{ hashFiles('formal/lean/install-toolchain.sh', 'formal/lean/lean-toolchain') }}
      - name: Install checksum-pinned Lean
        env:
          BIZKIT_LEAN_ARCHIVE_CACHE: ${{ runner.temp }}/bizkit-lean-archives
        run: |
          bash formal/lean/install-toolchain.sh "$RUNNER_TEMP/bizkit-lean"
          echo "$RUNNER_TEMP/bizkit-lean/bin" >> "$GITHUB_PATH"
      - name: Full Lean kernel check and axiom audit
        run: bash formal/lean/check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.32.0
      - name: Bounded Quint checks and negative controls
        run: bash formal/quint/check.sh

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      PGPASSWORD: postgres
      DATABASE_URL: ecto://dispatch:dispatch@localhost:5432/dispatch_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact revision
        run: git rev-parse HEAD
      - uses: erlef/setup-beam@v1
        with: { otp-version: '27.3.4', elixir-version: '1.19.0' }
      - name: Resolve pinned dependencies
        run: mix deps.get --check-locked
      - name: Create dispatch database role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE dispatch LOGIN SUPERUSER PASSWORD 'dispatch';"
      - name: Initialize signed ledger storage
        working-directory: apps/coop_substrate
        run: mix event_store.create --quiet && mix event_store.init --quiet
      - name: Migrate Dispatch database
        working-directory: apps/dispatch
        run: mix ash.setup --quiet
      - name: Actual Dispatch transition/concurrency regression tests
        working-directory: apps/dispatch
        run: |
          mix test --include integration             test/dispatch/operations/board_test.exs             test/dispatch/operations/board_concurrency_test.exs
