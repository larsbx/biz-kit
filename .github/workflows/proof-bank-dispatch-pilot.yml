name: Proof Bank — Dispatch model/runtime correspondence

on:
  pull_request:
    paths:
      - 'apps/proof_bank_core/**'
      - 'apps/dispatch/lib/dispatch/operations/board.ex'
      - 'apps/dispatch/lib/dispatch/identity/principal_resolution.ex'
      - 'apps/dispatch/test/dispatch/operations/board*_test.exs'
      - 'formal/lean/**'
      - 'formal/quint/**'
      - '.github/workflows/proof-bank-dispatch-pilot.yml'
      - 'docs/proof-bank/dispatch/**'
  push:
    branches: [main]
    paths:
      - 'apps/proof_bank_core/**'
      - 'apps/dispatch/lib/dispatch/operations/board.ex'
      - 'apps/dispatch/lib/dispatch/identity/principal_resolution.ex'
      - 'apps/dispatch/test/dispatch/operations/board*_test.exs'
      - 'formal/lean/**'
      - 'formal/quint/**'
      - '.github/workflows/proof-bank-dispatch-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-linkage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Record exact revision
        run: git rev-parse HEAD
      - name: Compile and test portable review packet
        working-directory: apps/proof_bank_core
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --no-start
      - name: Refuse missing model or runtime witness
        working-directory: apps/proof_bank_core
        run: |
          mix run --no-start -e 'case ProofBankCore.DispatchPilot.audit_sources("../..") do :ok -> IO.puts("candidate anchors present (no proof claim)"); {:error, error} -> IO.inspect(error, label: "missing anchor"); System.halt(1) end'

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact revision
        run: git rev-parse HEAD
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/bizkit-lean-archives
          key: lean-archive-linux-x64-${{ hashFiles('formal/lean/install-toolchain.sh', 'formal/lean/lean-toolchain') }}
      - name: Install SHA-256-checked Lean
        env:
          BIZKIT_LEAN_ARCHIVE_CACHE: ${{ runner.temp }}/bizkit-lean-archives
        run: |
          bash formal/lean/install-toolchain.sh "$RUNNER_TEMP/bizkit-lean"
          echo "$RUNNER_TEMP/bizkit-lean/bin" >> "$GITHUB_PATH"
      - name: Full Lean proof check, kernel replay and axiom audit
        run: bash formal/lean/check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Quint
        run: npm install --global --no-audit --no-fund @informalsystems/quint@0.32.0
      - name: Bounded Quint checks and negative controls
        run: bash formal/quint/check.sh

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      PGPASSWORD: postgres
      DATABASE_URL: ecto://dispatch:dispatch@localhost:5432/dispatch_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact revision
        run: git rev-parse HEAD
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Create Dispatch role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE dispatch LOGIN SUPERUSER PASSWORD 'dispatch';"
      - name: Initialize EventStore for the integration suite
        working-directory: apps/coop_substrate
        run: mix event_store.create --quiet && mix event_store.init --quiet
      - name: Prepare Dispatch PostGIS database
        working-directory: apps/dispatch
        run: mix ash.setup --quiet
      - name: Transition, concurrency and grant revocation integration tests
        working-directory: apps/dispatch
        run: |
          mix test --include integration             test/dispatch/operations/board_test.exs             test/dispatch/operations/board_concurrency_test.exs             test/dispatch/operations/board_authority_concurrency_test.exs
