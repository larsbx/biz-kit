name: CI impact plan (advisory)

# Read-only, unconditional observation. Does NOT replace any required test job.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impact-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      mode: ${{ steps.impact.outputs.mode }}
      receipt_sha256: ${{ steps.impact.outputs.receipt_sha256 }}
      proposed_count: ${{ steps.impact.outputs.proposed_count }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify conservative planner and refusal tests
        run: python -m unittest tools/test_ci_impact_selector.py -v
      - name: Produce exact-revision read-only impact receipt
        id: impact
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          if [[ "$EVENT" == "pull_request" ]]; then
            test "$HEAD" = "$PR_HEAD"
            python tools/ci_impact_selector.py \
              --root . --event "$EVENT" --base "$PR_BASE" --head "$HEAD" \
              --output ci-impact-plan.json --github-output "$GITHUB_OUTPUT"
          else
            # Merge queues, post-merge, nightly and manual runs are broad by
            # design; no inferred selective skip can evade a required check.
            python tools/ci_impact_selector.py \
              --root . --event "$EVENT" --head "$HEAD" --force-full \
              --output ci-impact-plan.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Archive exact-revision advisory observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biz-kit-ci-impact-plan-${{ github.run_id }}
          path: ci-impact-plan.json
          if-no-files-found: warn
          retention-days: 30

  impact-plan-receipt:
    # A stable advisory result: only validates selector execution.
    # Never count this as the success of any actual test workflow.
    if: always()
    needs: [impact-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PLAN_RESULT: ${{ needs.impact-plan.result }}
      MODE: ${{ needs.impact-plan.outputs.mode }}
      RECEIPT_SHA256: ${{ needs.impact-plan.outputs.receipt_sha256 }}
      PROPOSED_COUNT: ${{ needs.impact-plan.outputs.proposed_count }}
    steps:
      - name: Reject missing, cancelled or malformed receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          [[ "$RECEIPT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PROPOSED_COUNT" =~ ^[0-9]+$ ]]
          case "$MODE" in
            full_fallback|focused_advisory) ;;
            *) exit 2 ;;
          esac
          {
            echo "### Advisory CI impact proposal"
            echo "Mode: $MODE"
            echo "Proposed focused workflows: $PROPOSED_COUNT"
            echo "Receipt SHA-256: $RECEIPT_SHA256"
            echo ""
            echo "Not a test acceptance result. Existing workflows remain authoritative."
          } >> "$GITHUB_STEP_SUMMARY"
