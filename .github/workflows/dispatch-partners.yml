name: Dispatch partner acceptance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/dispatch/**'
      - 'apps/biz_kit_identity/**'
      - 'config/**'
      - 'mix.*'
      - 'tools/dispatch-globe/**'
      - '.github/workflows/dispatch-partners.yml'
permissions:
  contents: read
jobs:
  dispatch-partners:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIX_ENV: test
      EVENTSTORE_USERNAME: postgres
      EVENTSTORE_PASSWORD: postgres
      PGPASSWORD: postgres
      DATABASE_URL: ecto://dispatch:dispatch@localhost:5432/dispatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: '27.3.4', elixir-version: '1.19.0' }
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Create dispatch database role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE dispatch LOGIN SUPERUSER PASSWORD 'dispatch';"
      - name: Initialize signed ledger storage for device-enrolment acceptance
        working-directory: apps/coop_substrate
        run: mix event_store.create --quiet && mix event_store.init --quiet
      - name: Migrate and run all dispatch tests including partner authorization
        working-directory: apps/dispatch
        run: mix ash.setup --quiet && mix test --include integration
      - name: Verify the machine contract and resource snapshots
        working-directory: apps/dispatch
        run: mix openapi.check && mix ash_postgres.generate_migrations --check
      - name: Verify fleet map formatting
        working-directory: apps/dispatch
        run: >-
          mix format --check-formatted
          lib/dispatch/operations/location_snapshot.ex
          lib/dispatch/operations/location_demand.ex
          lib/dispatch_web/streams/locations.ex
          lib/dispatch_web/controllers/fleet_locations_controller.ex
          lib/dispatch_web/controllers/fleet_map_controller.ex
          lib/dispatch_web/controllers/fleet_map_html.ex
          lib/dispatch_web/controllers/portal_html.ex
          lib/dispatch_web/router.ex
          test/dispatch/operations/location_snapshot_test.exs
          test/dispatch_web/fleet_locations_controller_test.exs
          test/dispatch_web/fleet_map_controller_test.exs

  dispatch-map-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/dispatch-globe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install pinned build and browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Stage same-origin globe assets
        run: npm run build
      - name: Check observation and transport boundaries
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render the real globe under Dispatch's browser policy
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-map-browser
          path: tools/dispatch-globe/artifacts/
          if-no-files-found: ignore
