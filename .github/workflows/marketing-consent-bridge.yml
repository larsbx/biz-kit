name: Marketing attribution consent composition

on:
  pull_request:
    paths:
      - 'apps/biz_kit_composition/**'
      - 'apps/sales_core/**'
      - 'apps/marketing_core/**'
      - '.github/workflows/marketing-consent-bridge.yml'
      - 'mix.exs'
      - 'mix.lock'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marketing-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.0'
      - run: mix deps.get --check-locked
      - name: Compile composition
        working-directory: apps/biz_kit_composition
        run: MIX_ENV=test mix compile --warnings-as-errors
      - name: Check formatting
        run: >-
          MIX_ENV=test mix format --check-formatted
          apps/biz_kit_composition/lib/biz_kit/marketing_bridge.ex
          apps/biz_kit_composition/test/marketing_bridge_test.exs
          apps/biz_kit_composition/mix.exs
      - name: Run marketing bridge negative and existing composition tests
        working-directory: apps/biz_kit_composition
        run: MIX_ENV=test mix test --no-start
