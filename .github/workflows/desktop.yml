name: Desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth
      - run: npm ci
      - name: Frontend regression tests
        run: npm test
      - name: Typecheck and build the frontend
        run: npm run check && npm run build
      - name: Test the backend
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build native acceptance tools and app
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version 2.0.4 --locked
          npm run tauri build -- --debug --no-bundle
      - name: Native Tauri panel acceptance
        if: runner.os == 'Linux'
        env:
          # Xvfb has no hardware compositor. Keep these overrides in CI only.
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          NO_AT_BRIDGE: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/panel-state-native.py src-tauri/target/debug/biz-kit

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: biz-kit ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
