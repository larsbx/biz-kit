name: Desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Report exact desktop source
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth
      - run: npm ci
      - name: Installer provenance contract
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend regression tests
        run: npm test
      - name: Typecheck and build the frontend
        run: npm run check && npm run build
      - name: Test the backend
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Install native acceptance driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.0.4 --locked
      - name: Build installable candidate
        run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - name: Native Tauri release acceptance
        if: runner.os == 'Linux'
        env:
          # Xvfb has no hardware compositor. Keep these overrides in CI only.
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          tls=$(mktemp -d)
          trust="/usr/local/share/ca-certificates/biz-kit-procurement-test-$$.crt"
          trap 'sudo rm -f "$trust"; sudo update-ca-certificates >/dev/null; rm -rf "$tls"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=biz-kit-procurement-test \
            -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' \
            -keyout "$tls/key.pem" -out "$tls/cert.pem"
          sudo install -m 0644 "$tls/cert.pem" "$trust"
          sudo update-ca-certificates
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 tests/panel-state-native.py src-tauri/target/release/biz-kit --service-owner-fixture \
            --procurement-tls "$tls/cert.pem" "$tls/key.pem"

      - name: Collect exact-source installers and checksums
        shell: bash
        run: >-
          python tools/collect-installers.py
          --bundle-root src-tauri/target --output candidate
          --platform '${{ runner.os }}'
          --source-sha "$(git rev-parse HEAD)"
      - name: Upload installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: biz-kit-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/candidate/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: biz-kit ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
