name: Group buy core

on:
  pull_request:
    paths:
      - "apps/group_buy_core/**"
      - ".github/workflows/group-buy-core.yml"
      - "docs/architecture/2026-10-26-federated-group-buy.md"
  push:
    branches: [main]
    paths:
      - "apps/group_buy_core/**"
      - ".github/workflows/group-buy-core.yml"

permissions:
  contents: read

jobs:
  group-buy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.19.0"
      - name: Pure group buy quote and conditional agreement tests
        run: mix test --warnings-as-errors
        working-directory: apps/group_buy_core
      - name: Enforce Elixir formatting
        run: |
          mix format mix.exs "lib/**/*.ex" "test/**/*.exs"
          git diff --exit-code -- mix.exs lib/ test/
        working-directory: apps/group_buy_core
