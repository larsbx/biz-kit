# Local development only: a persisted PostgreSQL 16 backing volume for
# AgentCore operational-state testing. THIS IS NOT A SECOND BUSINESS LEDGER.
# The production agent_ops schema must live in biz-kit's governed PostgreSQL
# database, not in another independently authoritative database.
#
# Both Docker Compose and Podman Compose can consume this Compose file.
# Do not run two engines against the same database files simultaneously.
# Do not use "down --volumes" unless intentionally discarding test data.
name: bizkit-agent-dev

services:
  db:
    image: ${BIZKIT_AGENT_PG_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizkit_agent_dev
      POSTGRES_USER: bizkit
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - agent_pg16_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${BIZKIT_AGENT_PG_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s

volumes:
  agent_pg16_data:
    # Explicit name: no surprise second volume when Compose project changes.
    name: bizkit-agent-pg16-data

secrets:
  db_password:
    # Must be a user-provisioned file OUTSIDE the repository, mode 0600.
    file: ${BIZKIT_PG_PASSWORD_FILE:?Provide an absolute path to a private DB password file}
